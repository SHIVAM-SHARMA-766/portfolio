# Build, test and deploy both sites.
#
# Every push and pull request: unit tests, build, browser end-to-end tests.
# Pushes to main (including every save in the admin panel) also deploy:
# the built files are rsynced to the web host over SSH, using a key that the
# host restricts to rsync inside /srv/portfolio (see deploy/setup-server.sh).
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP or hostname of the web host
#   DEPLOY_SSH_KEY      private key of the deploy user
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates on lessons come from git history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploy secrets are not set; skipping deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sync_dir() {
            rsync -rlz --delete --delay-updates --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
              "$1" "deploy@${DEPLOY_HOST}:$2"
          }
          sync_dir apps/site/dist/ site/
          sync_dir apps/learn/dist/ learn/
          echo "Deployed $(git rev-parse --short HEAD)"

      - name: Smoke test the live sites
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true # DNS may not point at the host yet
        run: |
          for url in $(node -p "const s=require('./content/site.json'); [s.siteUrl + '/terminal/', s.learnUrl + '/'].join(' ')"); do
            curl -fsS --max-time 20 -o /dev/null -w "%{http_code} $url\n" "$url"
          done
