<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#fafaf7;font-family:Inter,system-ui,sans-serif;color:#18181b;position:relative;overflow:hidden}
.glow{position:absolute;right:-120px;top:-160px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,#c2410c22,transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#18181b0a 1px,transparent 1px),linear-gradient(90deg,#18181b0a 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;left:80px;top:72px;right:440px;bottom:64px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:22px;color:#52525b}
.brand img{width:52px;height:52px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:84px;line-height:1.02;letter-spacing:-.02em;margin-top:56px}
.role{font-size:34px;color:#c2410c;font-weight:600;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.chips span{font-size:21px;padding:8px 16px;border:1.5px solid #18181b22;border-radius:99px;background:#fff;color:#3f3f46}
.url{margin-top:auto;font-size:24px;color:#52525b;font-weight:500}
.url b{color:#18181b}
.photo{position:absolute;right:40px;bottom:0;height:560px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#c2410c,#f97316 60%,#0f766e)}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="logo-mark.svg">Portfolio</div>
  <h1>Shivam Sharma</h1>
  <div class="role">DevOps / DevSecOps Engineer</div>
  <div class="chips"><span>AWS</span><span>Terraform</span><span>Kubernetes</span><span>Cloud Security</span></div>
  <div class="url"><b>portfolio.dev2ops.in</b> · projects, experience &amp; blog</div>
</div>
<img class="photo" src="../apps/site/public/images/profile-cutout.webp">
<div class="bar"></div>
</body></html>
